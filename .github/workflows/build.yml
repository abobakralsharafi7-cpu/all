name: بناء APK بروف دفتر
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: فك الضغط
        run: |
          [ -f "proof-daftar-github-ready.zip" ] && unzip -o proof-daftar-github-ready.zip && cp -r project/* . && rm -rf project proof-daftar-github-ready.zip || true
          [ -d "project" ] && cp -r project/* . && rm -rf project || true
          ls src/lib/ | head
      - name: إصلاح كل @/
        run: |
          find src -type f -exec sed -i 's|@/lib/|../lib/|g; s|@/components/|../components/|g; s|@/app/|./|g' {} \; || true
          grep -n "from.*lib" src/app/page.tsx | head -n 5
          grep -n "from.*lib" src/components/UnlimitedImage.tsx | head -n 5
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: android-actions/setup-android@v3
      - run: |
          npm install
          npm run build
          if [ ! -d "android" ]; then npx cap add android; fi
          cp -r icons/android/* android/app/src/main/res/ || true
          npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: proof-daftar-apk-professor
          path: android/app/build/outputs/apk/debug/app-debug.apk
