name: فك الضغط تلقائياً
on: [push]
permissions:
  contents: write
  workflows: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: فك الضغط
        run: |
          if [ -f "proof-daftar-github-ready.zip" ]; then
            echo "📦 وجد الملف، جاري فك الضغط..."
            sudo apt-get install -y unzip -qq
            unzip -o proof-daftar-github-ready.zip
            cp -r project/* . 2>/dev/null || true
            cp -r project/.github . 2>/dev/null || true
            rm -rf project proof-daftar-github-ready.zip
            git config user.name "Professor"
            git config user.email "professor@proof-daftar.com"
            git add -A
            git commit -m "فك الضغط تلقائياً - بروف دفتر جاهز" || echo "No changes"
            git push
            echo "✅ تم"
          else
            echo "لا يوجد ملف مضغوط - الملفات موجودة مسبقاً"
          fi
