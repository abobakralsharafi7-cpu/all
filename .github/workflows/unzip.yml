name: Unzip uploaded project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          rm -rf extracted
          unzip -t proof-daftar-github-ready.zip > unzip_test.log 2>&1
          test_code=$?

          if [ "$test_code" -eq 2 ]; then
            echo "ZIP file is corrupted or unreadable:"
            sed -n '1,200p' unzip_test.log
            exit 2
          fi

          unzip -o proof-daftar-github-ready.zip -d extracted > unzip_extract.log 2>&1 || echo "Unzip completed with warnings; continuing"
          sed -n '1,200p' unzip_extract.log || true

          rm -rf extracted/.github
          rsync -a --exclude='.git' extracted/ ./
          rm -rf extracted
          rm -f proof-daftar-github-ready.zip
          rm -f unzip_test.log unzip_extract.log

      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Extract project files" || echo "No changes to commit"
          git push
