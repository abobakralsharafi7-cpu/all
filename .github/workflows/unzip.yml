name: Unzip uploaded project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project without workflows
        run: |
          unzip -o proof-daftar-github-ready.zip -d extracted
          rm -rf extracted/.github
          cp -r extracted/. .
          rm -rf extracted
          rm -f proof-daftar-github-ready.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Extract project files" || echo "No changes to commit"
          git push
