name: بناء APK بروف دفتر
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: فك الضغط
        run: |
          rm -rf project src public icons 2>/dev/null || true
          if [ -f "proof-daftar-github-ready.zip" ]; then
            sudo apt-get install -y unzip -qq
            unzip -o proof-daftar-github-ready.zip
            cp -r project/* . 2>/dev/null || true
            rm -rf project proof-daftar-github-ready.zip
          fi

      - name: إصلاح المسارات
        run: |
          echo "إصلاح @/lib -> ../lib"
          sed -i 's|@/lib/unlimited-storage|../lib/unlimited-storage|g' src/app/page.tsx
          sed -i 's|@/lib/db/scalable-db|../lib/db/scalable-db|g' src/app/page.tsx
          sed -i 's|@/lib/native-helpers|../lib/native-helpers|g' src/app/page.tsx
          sed -i 's|@/components/|../components/|g' src/app/page.tsx || true
          sed -i 's|from "@/lib/|from "../lib/|g' src/app/page.tsx
          grep -n "from.*lib" src/app/page.tsx | head -n 10

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: android-actions/setup-android@v3

      - name: بناء
        run: |
          npm install
          npm run build
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          cp -r icons/android/* android/app/src/main/res/ || true
          npx cap sync android

      - name: بناء APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: proof-daftar-apk-professor
          path: android/app/build/outputs/apk/debug/app-debug.apk
