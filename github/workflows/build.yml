name: بناء APK بروف دفتر
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: فك الضغط
        run: |
          if [ -f "proof-daftar-github-ready.zip" ]; then
            sudo apt-get install -y unzip -qq
            rm -rf project src public icons 2>/dev/null || true
            unzip -o proof-daftar-github-ready.zip
            cp -r project/* . 2>/dev/null || true
            cp -r project/.* . 2>/dev/null || true
            rm -rf project proof-daftar-github-ready.zip
          fi
          ls -lh src/lib/ | head -n 20

      - name: إصلاح كل مسارات @/lib
        run: |
          echo "قبل:"
          grep -rn "@/lib" src --include="*.ts" --include="*.tsx" | head -n 10
          find src -type f \( -name "*.ts" -o -name "*.tsx" \) -exec sed -i 's|@/lib/|../lib/|g' {} \;
          find src -type f \( -name "*.ts" -o -name "*.tsx" \) -exec sed -i 's|@/components/|../components/|g' {} \;
          echo "بعد:"
          grep -rn "../lib" src/app/page.tsx | head -n 10

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: android-actions/setup-android@v3

      - name: بناء
        run: |
          npm install
          npm run build
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          cp -r icons/android/* android/app/src/main/res/ || true
          npx cap sync android

      - name: بناء APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: proof-daftar-apk-professor
          path: android/app/build/outputs/apk/debug/app-debug.apk
